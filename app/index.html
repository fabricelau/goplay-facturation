<title>Goplay Arena Facturation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phone; editor opens as a full panel with form + paper preview */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface-2:#F7F9F8; --ink:#14201D; --muted:#5A6864; --line:#D9E1DE;
  --accent:#0A6B60; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --ok:#1E7A3B; --ok-soft:#E1F3E6; --warn:#A8530C; --warn-soft:#FBEBDB; --danger:#B42318; --danger-soft:#FBE4E1;
  --neutral-soft:#E9EEEC; --info:#3A5BA8; --info-soft:#E3EAF8;
  --paper:#FFFFFF; --paper-ink:#1B1F1E; --paper-muted:#6B7471; --paper-line:#DADFDD; --paper-accent:#0A6B60;
  --shadow:0 1px 2px rgba(15,30,26,.06),0 6px 24px rgba(15,30,26,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#162120; --surface-2:#1A2725; --ink:#E4ECEA; --muted:#93A39F; --line:#293734;
  --accent:#43BBA9; --accent-ink:#052520; --accent-soft:#173B36;
  --ok:#62C47F; --ok-soft:#173622; --warn:#E6A160; --warn-soft:#3A2817; --danger:#F07B6E; --danger-soft:#3D1B18;
  --neutral-soft:#22302D; --info:#8FA9EA; --info-soft:#1D2944;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#162120; --surface-2:#1A2725; --ink:#E4ECEA; --muted:#93A39F; --line:#293734;
  --accent:#43BBA9; --accent-ink:#052520; --accent-soft:#173B36;
  --ok:#62C47F; --ok-soft:#173622; --warn:#E6A160; --warn-soft:#3A2817; --danger:#F07B6E; --danger-soft:#3D1B18;
  --neutral-soft:#22302D; --info:#8FA9EA; --info-soft:#1D2944;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.side-cta{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.main{min-width:0;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:28px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.info{background:var(--info-soft);border-color:transparent}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:13px;color:var(--muted)}
.tile.alert{border-color:var(--danger);box-shadow:inset 3px 0 0 var(--danger)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:17px}
.cols2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--f-mono);margin-left:4px;opacity:.75}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(96px,128px) minmax(0,1fr) 104px 108px 128px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
/* invoices of the same quote share a light pastel background */
:root{--g0:#FFF1E4;--g0s:#F2A15A;--g1:#E3F6F2;--g1s:#3FB59F;--g2:#FDE9F0;--g2s:#E77FA3;--g3:#E8F0FD;--g3s:#6E9BEA;--g4:#FFF8DC;--g4s:#E0B52E;--g5:#F0EAFB;--g5s:#9B7BE0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g0:rgba(242,161,90,.14);--g1:rgba(63,181,159,.14);--g2:rgba(231,127,163,.14);--g3:rgba(110,155,234,.15);--g4:rgba(224,181,46,.13);--g5:rgba(155,123,224,.15)}}
:root[data-theme="dark"]{--g0:rgba(242,161,90,.14);--g1:rgba(63,181,159,.14);--g2:rgba(231,127,163,.14);--g3:rgba(110,155,234,.15);--g4:rgba(224,181,46,.13);--g5:rgba(155,123,224,.15)}
.li.grp{background:var(--gb);box-shadow:inset 4px 0 0 var(--gs)}
.li.grp:hover{background:var(--gb);filter:brightness(.97)}
.li.hd{cursor:default;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding-block:9px}
.li.hd:hover{background:none}
.li .cl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .cl small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;justify-self:start}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-draft{background:var(--neutral-soft);color:var(--muted)}
.p-sent{background:var(--info-soft);color:var(--info)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--danger-soft);color:var(--danger)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

.todo{display:flex;flex-direction:column}
.todo button{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left;width:100%}
.todo button:hover{background:var(--surface-2)}
.todo button:last-child{border-bottom:0}
.todo .t{min-width:0}
.todo .t b{display:block;font-weight:600}
.todo .t span{font-size:13px;color:var(--muted)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;padding:16px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=url],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
fieldset{border:0;margin:0;padding:0}
.sec-title{font-family:var(--f-display);font-size:16px;padding:16px 16px 0}

/* editor */
.editor{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ed-bar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.ed-bar h2{font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ed-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:20px;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ed-body.ro{grid-template-columns:minmax(0,700px) minmax(0,300px);justify-content:center}
.ed-form{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-tabs{display:none}
.lines{overflow-x:auto}
.lines table{width:100%;border-collapse:collapse;min-width:620px}
.lines th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.lines td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.lines td input,.lines td select{padding:7px 8px}
.lines .w-q{width:72px}.lines .w-u{width:84px}.lines .w-p{width:110px}.lines .w-t{width:86px}.lines .w-tot{width:110px;text-align:right;padding-top:13px}
.lines textarea{min-height:34px;margin-top:4px;font-size:13px;padding:6px 8px}
.add-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;align-items:center}
.add-row select{width:auto;max-width:100%}
.totals{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-end}
.totals div{display:flex;gap:24px;justify-content:space-between;min-width:260px}
.totals .big{font-weight:600;font-size:17px}
.side-actions{display:flex;flex-direction:column;gap:10px}
.side-actions .panel{padding:16px;display:flex;flex-direction:column;gap:10px}
.side-actions h3{font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}

/* paper */
.paper-wrap{position:sticky;top:0;align-self:start;min-width:0}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:var(--shadow);border:1px solid var(--line);padding:34px 32px;font-size:11.5px;line-height:1.45;aspect-ratio:210/297;overflow:visible;position:relative;font-family:var(--f-body);width:100%;max-width:700px;margin:0 auto}
.paper .pp-wm{overflow:hidden}
.pp-top{display:flex;justify-content:space-between;gap:16px}
.pp-co b{font-size:14px;display:block;color:var(--paper-ink)}
.pp-co,.pp-cl{color:var(--paper-muted)}
.pp-title{text-align:right}
.pp-title h4{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:.04em;color:var(--paper-accent)}
.pp-title .n{font-family:var(--f-mono);color:var(--paper-ink)}
.pp-cl{margin:22px 0 14px auto;width:52%;border:1px solid var(--paper-line);border-radius:4px;padding:10px 12px}
.pp-cl b{color:var(--paper-ink)}
.pp-obj{margin:0 0 10px;color:var(--paper-ink)}
.pp table{width:100%;border-collapse:collapse}
.pp th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--paper-muted);border-bottom:1.5px solid var(--paper-ink);padding:5px 4px}
.pp td{padding:6px 4px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.pp td small{display:block;color:var(--paper-muted)}
.pp .r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-tot{margin-left:auto;width:55%;margin-top:10px}
.pp-tot div{display:flex;justify-content:space-between;padding:2px 4px}
.pp-tot .g{border-top:1.5px solid var(--paper-ink);margin-top:4px;padding-top:5px;font-weight:600;font-size:13px}
.pp-pay{margin-top:12px;padding:8px 10px;background:var(--paper);border:1px dashed var(--paper-accent);border-radius:4px;color:var(--paper-ink);word-break:break-all}
.pp-ment{margin-top:14px;color:var(--paper-muted);font-size:9.5px}
.pp-ment p{margin:0 0 3px}
.pp-wm{position:absolute;top:44%;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:64px;color:var(--paper-line);transform:rotate(-24deg);pointer-events:none;letter-spacing:.1em}
.pp-sign{display:flex;justify-content:space-between;margin-top:16px;gap:16px;color:var(--paper-muted);font-size:10px}
.pp-sign div{flex:1;border-top:1px solid var(--paper-line);padding-top:4px;min-height:44px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:50;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dialog{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line)}
.dialog .panel-h{position:sticky;top:0;background:var(--surface);z-index:1}
.dialog .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dialog .body{padding:16px;display:flex;flex-direction:column;gap:10px}
.errs{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:14px}
.errs ul{margin:4px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:80;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.mobile-nav{display:none}

/* added */
.pp-logo{max-height:52px;max-width:180px;display:block;margin-bottom:6px}
.pp-evt{margin:0 0 12px;padding:8px 10px;border-left:3px solid var(--paper-accent);background:var(--paper);color:var(--paper-ink)}
.pp-evt div{margin:1px 0}
.pp-cond{margin-top:12px;color:var(--paper-ink);font-size:10px}
.pp-cond b{display:block;margin-bottom:2px}
.pp-cond p{margin:0 0 2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px}
.chart .v{fill:var(--ink);font-family:var(--f-mono);font-size:10.5px}
.chart .bar{fill:var(--accent)}
.chart .bar.cur{fill:var(--accent);opacity:.55}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbars{display:flex;flex-direction:column;gap:10px;padding:16px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.hbar .track{grid-column:1/-1;height:8px;background:var(--neutral-soft);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:4px}
.hbar .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copybox{display:flex;flex-direction:column;gap:6px}
.copybox textarea{min-height:160px;font-size:14px}
.logo-prev{max-height:60px;max-width:200px;border:1px dashed var(--line);border-radius:6px;padding:4px;background:var(--paper)}
.imp-table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.imp-table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
.imp-table td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dialog.wide{width:min(760px,100%)}
.cl-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.cl-info{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:2px}
@media (max-width:980px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols2{grid-template-columns:1fr}
  .ed-body,.ed-body.ro{grid-template-columns:1fr}
  .ed-tabs{display:flex}
  .ed-body[data-tab="form"] .paper-wrap{display:none}
  .ed-body[data-tab="preview"] .ed-form{display:none}
  .ed-body.ro .paper-wrap{display:block}
  .paper-wrap{position:static}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
  .head h1{font-size:23px}
  .mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--muted);text-decoration:none}
  .mobile-nav a svg{width:20px;height:20px}
  .mobile-nav a.on{color:var(--accent)}
  .li{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .li.hd{display:none}
  .li .c-date{grid-column:1;font-size:13px;color:var(--muted)}
  .li .c-num{grid-column:1}
  .li .c-cli{grid-column:1/-1;order:-1}

function vDocs(which){

  const filters=which==='avoirs'?[['tous','Tous'],['brouillon','Brouillons'],['emis','Émis']]:which==='devis'?[['tous','Tous'],['brouillon','Brouillons'],['emis','À envoyer'],['envoye','Envoyés'],['accepte','Acceptés'],['facture','Facturés'],['refuse','Refusés'],['annule','Annulés']]
    :[['tous','Tous'],['brouillon','Brouillons'],['emise','À encaisser'],['retard','En retard'],['payee','Payées'],['avoir','Avoirs']];
  const cur=S.filter[which];
  const match=(d,k)=>k==='tous'||(which==='avoirs'?d.statut===k:k==='avoir'?d.type==='avoir':(d.type!=='avoir'||k==='brouillon')&&statusOf(d)===k);

  return `<div class="head"><div><h1>${which==='devis'?'Devis':'Factures'}</h1><p>${which==='devis'?'Propositions envoyées à tes clients. Un devis accepté devient une facture en un clic.':'Factures et avoirs. Une facture émise est verrouillée : on la corrige avec un avoir.'}</p></div>

  <div class="row" style="justify-content:space-between"><div class="chips">${filters.map(([k,l])=>`<button class="chip ${cur===k?'on':''}" data-filter="${which}:${k}">${l}<span class="c">${all.filter(d=>match(d,k)).length}</span></button>`).join('')}</div>

  <div class="panel"><div class="list">${listHead()}${shownQ.length?shownQ.map(docRow).join(''):`<div class="empty">Aucun document ici.</div>`}</div></div>`;

function bindView(v){
  $$('[data-open]',v).forEach(b=>b.addEventListener('click',()=>{const d=S.docs.find(x=>x.id===b.dataset.open);d&&openEditor(JSON.parse(JSON.stringify(d)));}));
  $$('[data-deldrafts]',v).forEach(b=>b.addEventListener('click',async()=>{const w=b.dataset.deldrafts;const types=w==='devis'?['devis']:w==='avoirs'?['avoir']:['facture','avoir'];
    const drafts=S.docs.filter(d=>types.includes(d.type)&&d.statut==='brouillon');if(!drafts.length)return;
    if(!await confirmBox(`Supprimer ${drafts.length} brouillon${drafts.length>1?'s':''} ?`,`Tous les ${w==='devis'?'devis':w==='avoirs'?'avoirs':'factures et avoirs'} en brouillon seront supprimés. Ils n'ont pas de numéro : ta numérotation n'est pas touchée. Les documents émis ne sont pas concernés.`,'Supprimer',true))return;
    try{for(const d of drafts)await deleteDraft(d);toast(`${drafts.length} brouillon${drafts.length>1?'s':''} supprimé${drafts.length>1?'s':''}`);}catch(e){console.error(e);toast('Certains brouillons n\'ont pas pu être supprimés. Réessaie.');}}));
  $$('[data-cview]',v).forEach(b=>b.addEventListener('click',()=>{S.clientView=b.dataset.cview;render();window.scrollTo(0,0);}));
  $$('[data-cback]',v).forEach(b=>b.addEventListener('click',()=>{S.clientView=null;render();}));
  $$('[data-cattab]',v).forEach(b=>b.addEventListener('click',()=>{S.catTab=b.dataset.cattab;render();}));
  $$('[data-formule]',v).forEach(b=>b.addEventListener('click',()=>formuleForm(b.dataset.formule==='new'?null:S.formules.find(f=>f.id===b.dataset.formule))));
  const imp=$('#imp-sumup',v);if(imp)imp.addEventListener('click',sumupImport);
  $$('[data-filter]',v).forEach(b=>b.addEventListener('click',()=>{const [w,k]=b.dataset.filter.split(':');S.filter[w]=k;render();}));
  $$('input[id^="search-"]',v).forEach(i=>i.addEventListener('input',()=>{const w=i.id.slice(7);S.search={...(S.search||{}),[w]:i.value};render();const n=$('#'+i.id);n.focus();n.setSelectionRange(i.value.length,i.value.length);}));

  const sp=$('#save-params',v);

    let regime=S.settings.regimeTva;

    const bf=$('#bk-file',v);bf.addEventListener('change',()=>{const f=bf.files&&bf.files[0];if(f)importBackup(f);bf.value='';});

      try{for(const d of t)await remove('docs',d.id);toast('Documents de test supprimés');}catch(e){toast('Certains documents n\'ont pas pu être supprimés. Réessaie.');}});
    $('#reset-all',v).addEventListener('click',resetAll);

    const ht=$('#hide-test',v);ht.addEventListener('change',()=>safe(()=>putSettings({...S.settings,cacherTest:ht.checked}),ht.checked?'Bouton du mode test caché':'Bouton du mode test affiché'));

    const ld=$('#p-logo-del',v);if(ld)ld.addEventListener('click',()=>safe(()=>putSettings({...S.settings,logo:'',logoW:0,logoH:0}),'Logo retiré'));

}

/* ---------- client & article forms ---------- */
function clientForm(c){
  const x=c?{...c}:{id:null,nom:'',prenom:'',nomFamille:'',type:'particulier',siren:'',tvaIntra:'',adresse:'',cp:'',ville:'',email:'',tel:'',contact:''};
  if(x.type!=='pro'&&!x.prenom&&!x.nomFamille&&x.nom){const p=x.nom.split(' ');x.prenom=p.length>1?p.shift():'';x.nomFamille=p.join(' ');}
  const f=(k,l,type='text',cls='')=>`<div class="field ${cls}"><label for="c-${k}">${l}</label><input type="${type}" id="c-${k}" data-k="${k}" value="${esc(x[k])}"></div>`;
  return new Promise(res=>openModal(`<div class="panel-h"><h2>${c?'Modifier le client':'Nouveau client'}</h2><button class="btn ghost sm" data-a="close" aria-label="Fermer">${ICON.x}</button></div>
    <div class="form">
      <div class="field full"><label>Type</label><div class="seg" id="c-type"><button data-v="particulier" class="${x.type!=='pro'?'on':''}">Particulier</button><button data-v="pro" class="${x.type==='pro'?'on':''}">Professionnel</button></div></div>
      ${HOSTED?`<div class="field full for-pro"><label for="c-search">Rechercher l'entreprise (nom ou SIREN)</label><div class="row" style="flex-wrap:nowrap"><input type="text" id="c-search" placeholder="Ex. GB GLOBAL ou 988176129" autocomplete="off"><button class="btn" type="button" id="c-search-go">Rechercher</button></div><span class="hint">Les informations officielles se remplissent toutes seules depuis l'annuaire des entreprises.</span><div id="c-results" class="co-results"></div></div>`:''}
      ${f('prenom','Prénom','text','for-part')}${f('nomFamille','Nom','text','for-part')}
      ${f('nom','Raison sociale','text','full for-pro')}${f('contact','Personne à contacter (facultatif)','text','for-pro')}${f('siren','SIREN','text','for-pro')}
      ${f('adresse','Adresse','text','full')}${f('cp','Code postal')}${f('ville','Ville')}${f('email','E-mail','email')}${f('tel','Téléphone','tel')}${f('tvaIntra','N° TVA intracommunautaire (facultatif)','text','full for-pro')}
    </div>
    <div class="foot">${c?`<button class="btn danger" data-a="del" style="margin-right:auto">Supprimer</button>`:''}<button class="btn" data-a="close">Annuler</button><button class="btn primary" data-a="save">Enregistrer</button></div>`,dl=>{
      const sgo=$('#c-search-go',dl);if(sgo){const run=async()=>{const q=$('#c-search',dl).value.trim();const box=$('#c-results',dl);if(q.length<3){box.innerHTML='<span class="hint">Tape au moins 3 caractères.</span>';return;}
        box.innerHTML='<span class="hint">Recherche…</span>';
        try{const r=await fetch(window.GPF.rest+'entreprises?q='+encodeURIComponent(q),{credentials:'same-origin',headers:{'X-WP-Nonce':window.GPF.nonce}});const j=await r.json();if(!r.ok)throw new Error(j.message||'Erreur');
          const res=j.results||[];if(!res.length){box.innerHTML='<span class="hint">Aucune entreprise trouvée. Vérifie l\'orthographe ou le SIREN.</span>';return;}
          box.innerHTML=res.map((c,i)=>`<button type="button" class="co-item" data-co="${i}"><b>${esc(c.nom)}</b>${c.actif?'':' <span class="pill p-bad">Fermée</span>'}<small>SIREN ${esc(c.siren)} · ${esc(titleCase([c.adresse,[c.cp,titleCase(c.ville)].filter(Boolean).join(' ')].filter(Boolean).join(', ')))}</small></button>`).join('');
          $$('[data-co]',box).forEach(b=>b.addEventListener('click',()=>{const c=res[+b.dataset.co];const set=(k,v)=>{const i=$('#c-'+k,dl);if(i&&v)i.value=v;};
            set('nom',c.nom);set('siren',c.siren);set('tvaIntra',c.tva);set('adresse',titleCase(c.adresse));set('cp',c.cp);set('ville',titleCase(c.ville));
            box.innerHTML=`<span class="hint" style="color:var(--ok)">✓ Informations remplies depuis l'annuaire. Ajoute l'e-mail et le téléphone.</span>`;if(!c.actif)toast('Attention : cette entreprise est indiquée comme fermée.');}));
        }catch(e){box.innerHTML=`<span class="hint" style="color:var(--danger)">${esc(e.message||"La recherche n'a pas abouti.")}</span>`;}};
        sgo.addEventListener('click',run);$('#c-search',dl).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run();}});}
      const showType=()=>{$$('.for-part',dl).forEach(el=>el.hidden=x.type==='pro');$$('.for-pro',dl).forEach(el=>el.hidden=x.type!=='pro');};showType();
      $$('#c-type button',dl).forEach(b=>b.addEventListener('click',()=>{x.type=b.dataset.v;$$('#c-type button',dl).forEach(y=>y.classList.toggle('on',y===b));showType();}));
      dl.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;
        if(a.dataset.a==='close'){closeModal();res(null);}
        if(a.dataset.a==='save'){$$('[data-k]',dl).forEach(i=>x[i.dataset.k]=i.value.trim());
          if(x.type!=='pro'){if(!x.nomFamille){toast('Indique au moins le nom du client');return;}x.nom=[x.prenom,x.nomFamille].filter(Boolean).join(' ');x.contact='';x.siren='';x.tvaIntra='';}
          else if(!x.nom){toast('Indique la raison sociale du client');return;}
          const saved=await safe(()=>put('clients',x),'Client enregistré');closeModal();res(saved);}
        if(a.dataset.a==='del'){if((S.allDocs||S.docs).some(d=>d.clientId===c.id&&d.seq)){toast("Ce client a des documents émis : il ne peut pas être supprimé.");return;}
          closeModal();if(await confirmBox('Supprimer ce client ?',esc(c.nom)+' sera retiré de ta liste.','Supprimer',true)){await safe(()=>remove('clients',c.id),'Client supprimé');}res(null);}
      });
    }));
}
function articleForm(a){
  const x=a?{...a}:{id:null,designation:'',details:'',unite:'u',pu:'',puTTC:'',tva:isFranchise()?0:8.5};const modeTTC=S.settings.saisiePrix==='ttc';if(a&&modeTTC)x.puTTC=artTTC(a);
  openModal(`<div class="panel-h"><h2>${a?"Modifier l'article":'Nouvel article'}</h2><button class="btn ghost sm" data-a="close" aria-label="Fermer">${ICON.x}</button></div>
    <div class="form">
      <div class="field full"><label for="a-designation">Désignation</label><input type="text" id="a-designation" data-k="designation" value="${esc(x.designation)}"></div>
      <div class="field full"><label for="a-details">Détails (facultatif)</label><textarea id="a-details" data-k="details">${esc(x.details)}</textarea></div>
      ${modeTTC?`<div class="field"><label for="a-puTTC">Prix unitaire TTC (€)</label><input type="number" step="0.01" id="a-puTTC" data-k="puTTC" value="${esc(x.puTTC)}"></div>`:`<div class="field"><label for="a-pu">Prix unitaire HT (€)</label><input type="number" step="0.01" id="a-pu" data-k="pu" value="${esc(x.pu)}"></div>`}
      <div class="field"><label for="a-unite">Unité</label><select id="a-unite" data-k="unite">${UNITES.map(u=>`<option ${u===x.unite?'selected':''}>${u}</option>`).join('')}</select></div>
      <div class="field"><label for="a-tva">TVA</label><select id="a-tva" data-k="tva">${TVA_RATES.map(t=>`<option value="${t}" ${+t===+x.tva?'selected':''}>${fmtTaux(t)}</option>`).join('')}</select></div>
    </div>
    <div class="foot">${a?`<button class="btn danger" data-a="del" style="margin-right:auto">Supprimer</button>`:''}<button class="btn" data-a="close">Annuler</button><button class="btn primary" data-a="save">Enregistrer</button></div>`,dl=>{
    dl.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='close')closeModal();
      if(b.dataset.a==='save'){$$('[data-k]',dl).forEach(i=>x[i.dataset.k]=i.value);x.tva=+x.tva;if(modeTTC){x.puTTC=+x.puTTC||0;x.pu=r2(x.puTTC/(1+(isFranchise()?0:x.tva)/100));}else{x.pu=+x.pu||0;x.puTTC=r2(x.pu*(1+(isFranchise()?0:x.tva)/100));}if(!x.designation){toast('Indique une désignation');return;}
        await safe(()=>put('articles',x),'Article enregistré');closeModal();}
      if(b.dataset.a==='del'){closeModal();if(await confirmBox('Supprimer cet article ?',esc(a.designation)+' sera retiré du catalogue. Les documents existants ne changent pas.','Supprimer',true))await safe(()=>remove('articles',a.id),'Article supprimé');}
    });
  });
}

/* ---------- editor ---------- */
function openEditor(d){S.edit=d;S.edTab=d.statut==='brouillon'?'form':'preview';renderEditor();$('#editor').hidden=false;document.body.style.overflow='hidden';}
function closeEditor(){$('#editor').hidden=true;S.edit=null;document.body.style.overflow='';render();}
const locked=d=>d.statut!=='brouillon';

function renderEditor(){
  const d=S.edit;const old=$('#editor');const ed=old.cloneNode(false);old.replaceWith(ed);const ro=locked(d);
  const tl=isAc(d)?"Facture d'acompte":TYPE_LBL[d.type];const title=d.numero?`${tl} ${d.numero}`:`${tl} — brouillon`;
  ed.innerHTML=`<div class="ed-bar"><div class="row"><button class="btn ghost" id="ed-close">${ICON.back} Retour</button><h2>${esc(title)} ${pill(d)}</h2></div>
    <div class="row">${ro?'':`<button class="btn" id="ed-save">Enregistrer le brouillon</button><button class="btn primary" id="ed-emit">${d.type==='devis'?'Émettre le devis':d.type==='avoir'?"Émettre l'avoir":'Émettre la facture'}</button>`}</div></div>
    <div class="ed-body ${ro?'ro':''}" data-tab="${S.edTab}">
      ${ro?'':`<div class="ed-tabs seg" style="grid-column:1/-1;justify-self:start"><button data-tab="form" class="${S.edTab==='form'?'on':''}">Saisie</button><button data-tab="preview" class="${S.edTab==='preview'?'on':''}">Aperçu</button></div>`}
      ${ro?`<div class="paper-wrap" style="position:static"><div class="paper long" id="paper"></div></div><div class="side-actions">${roActions(d)}</div>`
          :`<div class="ed-form">${formHtml(d)}</div><div class="paper-wrap"><div class="paper" id="paper"></div></div>`}
    </div>`;
  $('#ed-close').addEventListener('click',async()=>{if(!ro&&dirty()){if(!await confirmBox('Quitter sans enregistrer ?','Les modifications de ce brouillon seront perdues.','Quitter',true))return;}closeEditor();});
  $$('.ed-tabs button',ed).forEach(b=>b.addEventListener('click',()=>{S.edTab=b.dataset.tab;$('.ed-body',ed).dataset.tab=S.edTab;$$('.ed-tabs button',ed).forEach(x=>x.classList.toggle('on',x===b));}));
  if(!ro){bindForm(ed);$('#ed-save').addEventListener('click',saveDraft);$('#ed-emit').addEventListener('click',emit);}
  else bindRo(ed);
  updatePreview();
}
function dirty(){const d=S.edit;const orig=S.docs.find(x=>x.id===d.id);if(!orig)return (d.lignes||[]).some(l=>l.designation)||!!d.clientId;const a=strip(orig),b=strip(d);delete a.updatedAt;delete b.updatedAt;return JSON.stringify(a)!==JSON.stringify(b);}

    <div class="field full"><label for="e-objet">Objet</label><input type="text" id="e-objet" data-f="objet" value="${esc(d.objet)}" placeholder="Ex. Rénovation salle de bain"></div>

  </div></div>
  ${d.type!=='avoir'?`<div class="panel"><div class="panel-h"><h2>Événement</h2><span class="muted" style="font-size:13px">Facultatif · imprimé sur le document</span></div><div class="form">

    <div class="field"><label for="e-accompagnateurs">Nombre d'accompagnateurs</label><input type="number" min="0" step="1" id="e-accompagnateurs" data-f="accompagnateurs" value="${esc(d.accompagnateurs)}"></div>
    <div class="field full"><label for="e-evtNote">Note personnalisée</label><textarea id="e-evtNote" data-f="evtNote" placeholder="Ex. Prévoir des chaussures fermées. Gâteau apporté par la famille.">${esc(d.evtNote)}</textarea><span class="hint">S'affiche sur le document, sous les informations de l'événement.</span></div>
    ${d.type==='devis'?`<div class="field full"><label style="display:flex;align-items:flex-start;gap:8px;color:var(--ink);font-size:14px;font-weight:500"><input type="checkbox" id="e-ferme" ${d.montantFerme!==false?'checked':''} style="width:18px;height:18px;flex:none;margin-top:2px"> Montant dû même si moins de participants le jour J</label><span class="hint">Affiche ou masque cette condition dans les conditions de réservation du devis.</span></div>`:''}
  </div></div>`:''}
  <div class="panel"><div class="panel-h"><h2>Lignes</h2></div><div class="lines" id="e-lines">${linesHtml(d)}</div>
    <div class="add-row"><button class="btn" id="e-addline">+ Ligne libre</button>${S.formules.length?`<select id="e-addform"><option value="">+ Formule…</option>${[...S.formules].sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')).map(f=>`<option value="${f.id}">${esc(f.nom)}</option>`).join('')}</select>`:''}<button class="btn" id="e-remise">+ Remise</button>${d.type==='facture'&&!isAc(d)&&d.clientId&&freeDepositsOf(d.clientId,d.id).filter(a=>!(d.lignes||[]).some(l=>l.acompteRef===a.id)).length?`<button class="btn" id="e-deduct">− Déduire un acompte</button>`:''}${S.articles.length?`<select id="e-addart"><option value="">+ Depuis le catalogue…</option>${[...S.articles].sort((a,b)=>(a.designation||'').localeCompare(b.designation||'')).map(a=>`<option value="${a.id}">${esc(a.designation)} · ${eur(+a.pu||0)}</option>`).join('')}</select>`:`<a class="btn ghost sm" href="#catalogue" id="e-tocat">Créer un catalogue</a>`}</div>
    <div class="totals" id="e-totals"></div></div>
  <div class="panel"><div class="form">
    ${d.type==='facture'?`<div class="field full"><label for="e-lien">Lien de paiement SumUp (facultatif)</label><input type="url" id="e-lien" data-f="lienPaiement" value="${esc(d.lienPaiement)}" placeholder="https://pay.sumup.com/…"><span class="hint">Crée le lien dans ton appli SumUp et colle-le ici : il apparaîtra sur la facture pour un paiement par carte.</span></div>`:''}
    ${d.type==='devis'?`<div class="field full"><label style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;font-weight:500"><input type="checkbox" id="e-acDem" ${d.acompteDemande?'checked':''} style="width:18px;height:18px"> Acompte à verser à la réservation</label>

    <div class="field full"><label for="e-notes">Notes pour le client</label><textarea id="e-notes" data-f="notes" placeholder="${d.type==='devis'?'Ex. Acompte de 30 % à la commande':'Ex. Merci pour votre confiance'}">${esc(d.notes)}</textarea></div>

  ${S.docs.some(x=>x.id===d.id)?`<div class="row"><button class="btn danger" id="e-del">Supprimer ce brouillon</button></div>`:''}`;

function linesHtml(d){
  const fr=isFranchise();
  return `<table><thead><tr><th>Désignation</th><th class="w-q">Qté</th><th class="w-u">Unité</th><th class="w-p">${isTTC(d)?'PU TTC':'PU HT'}</th>${fr?'':'<th class="w-t">TVA</th>'}<th class="w-tot" style="padding-top:8px">${isTTC(d)?'Total TTC':'Total HT'}</th><th></th></tr></thead><tbody>
  ${d.lignes.map((l,i)=>`<tr data-i="${i}"><td><input type="text" data-l="designation" value="${esc(l.designation)}" placeholder="Désignation" aria-label="Désignation ligne ${i+1}"><textarea data-l="details" placeholder="Détails (facultatif)" aria-label="Détails ligne ${i+1}">${esc(l.details)}</textarea></td>
    <td class="w-q"><input type="number" step="any" data-l="qte" value="${esc(l.qte)}" aria-label="Quantité"></td>
    <td class="w-u"><select data-l="unite" aria-label="Unité">${UNITES.map(u=>`<option ${u===l.unite?'selected':''}>${u}</option>`).join('')}</select></td>
    <td class="w-p">${isTTC(d)?`<input type="number" step="0.01" data-l="puTTC" value="${esc(l.puTTC??'')}" aria-label="Prix unitaire TTC">`:`<input type="number" step="0.01" data-l="pu" value="${esc(l.pu)}" aria-label="Prix unitaire HT">`}</td>
    ${fr?'':`<td class="w-t"><select data-l="tva" aria-label="TVA">${TVA_RATES.map(t=>`<option value="${t}" ${+t===+l.tva?'selected':''}>${fmtTaux(t)}</option>`).join('')}</select></td>`}
    <td class="w-tot num" data-tot>${eur(isTTC(d)?lineTTC(l,d):lineHT(l,d))}</td>
    <td><button class="btn ghost sm" data-rm="${i}" aria-label="Supprimer la ligne" ${d.lignes.length<2?'disabled':''}>${ICON.x}</button></td></tr>`).join('')}</tbody></table>`;

function renderTotals(){

  const edd=$('#e-deduct',ed);if(edd)edd.addEventListener('click',()=>{const acs=freeDepositsOf(S.edit.clientId,S.edit.id).filter(a=>!S.edit.lignes.some(l=>l.acompteRef===a.id));
    const add=a=>{S.edit.lignes=[...S.edit.lignes.filter(l=>l.designation||hasPrice(l)),...deductLines(a)];renderEditor();toast(`Acompte ${a.numero} déduit`);};

  $('#e-addline',ed).addEventListener('click',()=>{S.edit.lignes.push({id:uid(),designation:'',details:'',qte:1,unite:'u',pu:0,puTTC:0,tva:isFranchise()?0:8.5});$('#e-lines').innerHTML=linesHtml(S.edit);updatePreview();const inp=$$('#e-lines tr[data-i] input[data-l="designation"]');inp[inp.length-1].focus();});
  const sa=$('#e-addart',ed);if(sa)sa.addEventListener('change',()=>{const a=S.articles.find(x=>x.id===sa.value);if(!a)return;const ls=S.edit.lignes;
    const ln={id:uid(),designation:a.designation,details:a.details||'',qte:1,unite:a.unite||'u',pu:+a.pu||0,puTTC:artTTC(a),tva:isFranchise()?0:+(a.tva??8.5)};

  $$('select[data-f]',ed).forEach(i=>i.addEventListener('change',()=>{S.edit[i.dataset.f]=i.value;updatePreview();}));
  const sf=$('#e-addform',ed);if(sf)sf.addEventListener('change',()=>{const f=S.formules.find(x=>x.id===sf.value);if(!f)return;const ls=S.edit.lignes;
    const add=(f.lignes||[]).map(l=>({id:uid(),designation:l.designation||'',details:l.details||'',qte:+l.qte||1,unite:l.unite||'u',pu:+l.pu||0,puTTC:+l.puTTC||r2((+l.pu||0)*(1+(isFranchise()?0:+l.tva||0)/100)),tva:isFranchise()?0:+(l.tva??8.5)}));
    if(ls.length===1&&!ls[0].designation&&!hasPrice(ls[0]))ls.splice(0,1);ls.push(...add);if(!S.edit.objet&&f.nom){S.edit.objet=f.nom;const o=$('#e-objet');if(o)o.value=f.nom;}
    $('#e-lines').innerHTML=linesHtml(S.edit);sf.value='';updatePreview();toast(`Formule « ${f.nom} » ajoutée`);});
  $('#e-remise',ed).addEventListener('click',remiseForm);
  const fe=$('#e-ferme',ed);if(fe)fe.addEventListener('change',()=>{S.edit.montantFerme=fe.checked;updatePreview();});
  const acd=$('#e-acDem',ed);if(acd){const acp=$('#e-acPct',ed);
    acd.addEventListener('change',()=>{S.edit.acompteDemande=acd.checked;if(acd.checked&&!S.edit.acomptePct)S.edit.acomptePct=+acp.value||30;$('#e-acRow',ed).hidden=!acd.checked;updatePreview();});
    acp.addEventListener('input',()=>{S.edit.acomptePct=Math.min(100,Math.max(0,+acp.value||0));updatePreview();});}
  const del=$('#e-del',ed);if(del)del.addEventListener('click',async()=>{if(await confirmBox('Supprimer ce brouillon ?','Il n\'a pas de numéro : sa suppression ne crée pas de trou dans ta numérotation.','Supprimer',true)){await safe(()=>deleteDraft(S.edit),'Brouillon supprimé');closeEditor();}});

function updatePreview(){renderTotals();const am=$('#e-acMt');if(am){const a=acompteDemande(S.edit);am.textContent=a?'soit '+eur(a.mt)+' TTC':'';}const p=$('#paper');if(p)p.innerHTML=paperHtml(S.edit);}

function snapshotClient(c){return c?{nom:c.nom,type:c.type,siren:c.siren||'',tvaIntra:c.tvaIntra||'',adresse:c.adresse||'',cp:c.cp||'',ville:c.ville||'',email:c.email||'',contact:c.contact||''}:null;}
function cleanLines(d){d.lignes=(d.lignes||[]).filter(l=>l.designation||hasPrice(l)).map(l=>({...l,qte:+l.qte||0,pu:+l.pu||0,puTTC:+l.puTTC||0,tva:isFranchise()?0:+l.tva||0}));if(!d.lignes.length)d.lignes=[{id:uid(),designation:'',details:'',qte:1,unite:'u',pu:0,tva:8.5}];}
async function saveDraft(){const d=S.edit;d.client=snapshotClient(clientById(d.clientId));await safe(()=>put('docs',JSON.parse(JSON.stringify(d))),'Brouillon enregistré');S.edit=JSON.parse(JSON.stringify(d));}
async function emit(){
  const d=S.edit;const errs=validateForEmit(d);
  if(errs.length){openModal(`<div class="panel-h"><h2>Il manque quelques informations</h2></div><div class="body"><div class="errs">Pour émettre ce document, ajoute :<ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div></div><div class="foot">${errs.some(e=>e.includes('Réglages'))?`<a class="btn" href="#parametres" data-a="go">Ouvrir les réglages</a>`:''}<button class="btn primary" data-a="ok">Compris</button></div>`,dl=>dl.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;closeModal();if(a.dataset.a==='go'){saveDraft().then(closeEditor,()=>{});}}));return;}
  const seq=nextSeq(d.type);const numero=makeNumero(d.type,seq,d.date);
  const msg=d.type==='devis'?`Le devis recevra le numéro <b class="num">${esc(numero)}</b>. Il sera marqué « Émis, à envoyer » jusqu'à ce que tu l'envoies au client.`
    :`${d.type==='facture'?'La facture':"L'avoir"} recevra le numéro <b class="num">${esc(numero)}</b>. Une fois émis, le document ne pourra plus être modifié ni supprimé : toute correction passera par un avoir.`;
  const cc=clientById(d.clientId);
  const warn=cc&&cc.type==='pro'&&d.type!=='devis'&&!cc.siren?`<br><br><span style="color:var(--c-orange)">Ce client professionnel n'a pas de SIREN. Ce n'est pas bloquant aujourd'hui, mais il deviendra obligatoire sur les factures entre professionnels en septembre 2027.</span>`:'';
  const warn2=d.type==='facture'&&!isAc(d)&&!d.evtDate?`<br><br><span style="color:var(--c-orange)">Aucune date de session n'est indiquée. Si la prestation a eu lieu (ou aura lieu) à une autre date que celle de la facture, la loi impose de l'indiquer : ajoute-la dans « Date de la session ».</span>`:'';
  if(!await confirmBox(`Émettre ${numero} ?`,msg+warn+warn2,'Émettre'))return;
  cleanLines(d);
  if(HOSTED&&window.GPF.quoteBase&&d.type==='devis'&&!d.signToken){d.signToken=payToken();d.lienDevis=window.GPF.quoteBase+d.signToken+'/';}
  if(HOSTED&&window.GPF.sumup&&d.type==='facture'&&!d.payToken){d.payToken=payToken();d.lienPaiement=window.GPF.payBase+d.payToken+'/';}
  const out={...d,seq,numero,statut:d.type==='devis'?'emis':d.type==='facture'?'emise':'emis',client:snapshotClient(clientById(d.clientId)),emisLe:new Date().toISOString(),entreprise:(({logo,logoW,logoH,...r})=>r)(S.settings)};
  await safe(()=>put('docs',out),`${numero} émis`);
  if(d.type==='avoir'&&d.factureId){const f=S.docs.find(x=>x.id===d.factureId);if(f&&totals(out).ttc>=totals(f).ttc-0.01)await safe(()=>put('docs',{...f,statut:'avoiree',avoirNumero:numero}));}
  S.edit=JSON.parse(JSON.stringify(out));S.edTab='preview';renderEditor();
}

/* read-only side actions */
function roActions(d){
  const t=totals(d);const st=statusOf(d);
  let main='';
  if(d.type==='devis'){
    if(d.statut==='emis')main=`<button class="btn" data-act="sent">Marquer comme envoyé</button>`;
    if(d.statut==='envoye'||d.statut==='emis')main+=`<button class="btn ${d.statut==='envoye'?'primary':''}" data-act="accepte">Marquer accepté</button><button class="btn" data-act="refuse">Marquer refusé</button>`;
    if(['accepte','envoye','emis'].includes(d.statut))main+=`<button class="btn" data-act="acompte">Facture d'acompte</button><button class="btn ${d.statut==='accepte'?'primary':''}" data-act="tofacture">${acomptesOf(d).length?'Facture de solde':'Transformer en facture'}</button>`;
    if(d.statut==='facture'&&d.factureId)main=`<button class="btn" data-act="gofacture">Voir la facture</button>`;
    if(['accepte','facture'].includes(d.statut)&&!issuedFromQuote(d).length)main+=`<button class="btn danger" data-act="cancelq">Annuler le devis</button>`;
    if(d.statut==='annule')main=`<span class="muted" style="font-size:13px">Devis annulé${d.annulation&&d.annulation.date?' le '+fmtDate(d.annulation.date):''}. Pour reproposer une prestation, utilise « Dupliquer ».</span>`;
  }
  if(d.type==='facture'){
    if(st==='emise'||st==='retard')main=`<button class="btn primary" data-act="paid">Marquer payée</button>`;
    if(d.statut!=='avoiree')main+=`<button class="btn" data-act="avoir">Créer un avoir</button>`;
  }
  const info=d.type==='facture'?`<dl class="kv"><dt>Total TTC</dt><dd class="num">${eur(t.ttc)}</dd>${d.devisNumero||d.acompteDevisNumero?`<dt>Devis</dt><dd><button class="btn ghost sm num" data-act="godevis" style="padding:0 4px">n° ${esc(d.devisNumero||d.acompteDevisNumero)} →</button></dd>`:''}<dt>Échéance</dt><dd>${fmtDate(d.echeance)}</dd>${d.paiement?`<dt>Payée le</dt><dd>${fmtDate(d.paiement.date)}</dd><dt>Mode</dt><dd>${esc(d.paiement.mode)}</dd>`:''}${d.avoirNumero?`<dt>Avoir</dt><dd class="num">${esc(d.avoirNumero)}</dd>`:''}</dl>`
    :d.type==='devis'?`<dl class="kv"><dt>Total TTC</dt><dd class="num">${eur(t.ttc)}</dd><dt>Valable jusqu'au</dt><dd>${fmtDate(d.validite)}</dd>${acomptesOf(d).map(a=>`<dt>Acompte</dt><dd class="num">${esc(a.numero||'brouillon')} · ${eur(totals(a).ttc)}</dd>`).join('')}${acomptesOf(d).length?`<dt>Reste à facturer</dt><dd class="num">${eur(t.ttc-acomptesOf(d).reduce((x,a)=>x+totals(a).ttc,0))}</dd>`:''}${d.factureNumero?`<dt>Facture</dt><dd class="num">${esc(d.factureNumero)}</dd>`:''}${d.acceptation?`<dt>Accepté en ligne</dt><dd>${fmtDate((d.acceptation.date||'').slice(0,10))}${d.acceptation.date?' à '+d.acceptation.date.slice(11,16).replace(':','h'):''}<br><span class="muted">par ${esc(d.acceptation.nom||'')}</span></dd>`:''}</dl>`
    :`<dl class="kv"><dt>Montant</dt><dd class="num">${eur(-t.ttc)}</dd><dt>Sur facture</dt><dd class="num">${esc(d.avoirDe||'—')}</dd></dl>`;
  const lastSend=(d.envois||[]).slice(-1)[0];
  main+=`<button class="btn ${d.type==='devis'&&d.statut==='emis'?'primary':''}" data-act="mail">Envoyer par e-mail</button>${d.type==='facture'&&(st==='emise'||st==='retard')?`<button class="btn ${st==='retard'?'primary':''}" data-act="relance">Envoyer une relance</button>`:''}${d.type==='devis'&&d.statut==='envoye'?`<button class="btn" data-act="relance">Relancer maintenant</button>`:''}${lastSend?`<span class="muted" style="font-size:12.5px">Dernier e-mail le ${fmtDate(lastSend.date)} (${lastSend.kind==='relance-auto'?'relance automatique':lastSend.kind==='relance'?'relance':'envoi'})</span>`:''}${(ri=>!ri?'':ri.done?`<span class="muted" style="font-size:12.5px">Relance envoyée le ${fmtDate(ri.done)}.</span>`:ri.noEmail?`<span class="muted" style="font-size:12.5px">Pas de relance automatique : ce client n'a pas d'adresse e-mail.</span>`:ri.expires||ri.past?'':`<span class="muted" style="font-size:12.5px">Sans réponse, relance automatique le ${fmtDate(ri.due)}.</span>`)(relanceInfo(d))}`;
  return `<div class="panel"><h3>Actions</h3>${info}${main}<button class="btn" data-act="pdf">${ICON.dl} Télécharger le PDF</button><button class="btn ghost" data-act="dup">Dupliquer en nouveau brouillon</button>${S.dl?'':`<span class="hint muted" style="font-size:12.5px">Le téléchargement n'est pas disponible dans cette vue.</span>`}</div>
  ${HOSTED&&window.GPF.sumup&&d.type==='facture'&&(st==='emise'||st==='retard')?`<div class="panel"><h3>Paiement par carte</h3>${d.payToken?`<span class="muted" style="font-size:13px">Lien automatique, au bon montant. La facture passera en « Payée » toute seule après le paiement.</span><input type="text" readonly id="ro-paylink" value="${esc(d.lienPaiement)}"><button class="btn sm" data-act="copylink">Copier le lien</button>`:`<button class="btn sm" data-act="mklink">Créer le lien de paiement</button>`}</div>`
   :d.type==='facture'&&(st==='emise'||st==='retard')?`<div class="panel"><h3>Paiement par carte</h3><div class="field"><label for="ro-lien">Lien de paiement SumUp</label><input type="url" id="ro-lien" value="${esc(d.lienPaiement)}" placeholder="https://pay.sumup.com/…"></div><button class="btn sm" data-act="lien">Enregistrer le lien</button><span class="muted" style="font-size:12.5px">Crée le lien dans l'appli SumUp, colle-le ici, puis télécharge à nouveau le PDF.</span></div>`:''}
  ${HOSTED&&window.GPF.quoteBase&&d.type==='devis'&&['emis','envoye'].includes(d.statut)?`<div class="panel"><h3>Signature en ligne</h3>${d.signToken?`<span class="muted" style="font-size:13px">Le client ouvre ce lien, lit le devis et clique sur « Accepter ». Le devis passe tout seul en « Accepté » et tu reçois un e-mail.</span><input type="text" readonly id="ro-signlink" value="${esc(d.lienDevis)}"><button class="btn sm" data-act="copysign">Copier le lien</button>`:`<button class="btn sm" data-act="mksign">Créer le lien de signature</button>`}</div>`:''}
  <div class="panel"><h3>Client</h3><span>${esc(clientLabel(d.client))}</span><span class="muted" style="font-size:13px">${esc([d.client&&d.client.email,d.client&&d.client.tel].filter(Boolean).join(' · '))}</span></div>`;
}
function bindRo(ed){
  ed.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const fr=(S.allDocs||S.docs).find(x=>x.id===S.edit.id);if(fr&&fr!==S.edit){S.edit=JSON.parse(JSON.stringify(fr));}const d=S.edit;const a=b.dataset.act;
    if(a==='accepte'||a==='refuse'){const nd={...d,statut:a};await safe(()=>put('docs',nd),a==='accepte'?'Devis accepté':'Devis marqué refusé');S.edit=nd;renderEditor();}
    if(a==='tofacture'){const acs=acomptesOf(d);
      if(acs.some(x=>!x.seq)){toast("Émets ou supprime d'abord la facture d'acompte en brouillon, avant la facture de solde.");return;}
      const ded=acs.flatMap(ac=>ac.lignes.map(l=>({id:uid(),designation:`Acompte déjà facturé (facture n° ${ac.numero})`,details:'',qte:1,unite:'forfait',pu:-r2(lineHT(l,ac)),puTTC:-lineTTC(l,ac),tva:l.tva,acompteRef:ac.id})));
      const f=newDoc('facture',{...evtOf(d),clientId:d.clientId,objet:d.objet,saisie:d.saisie||'ht',lignes:[...d.lignes.map(l=>({...l,id:uid()})),...ded],notes:'',devisId:d.id,devisNumero:d.numero});
      await safe(()=>put('docs',f));const nd={...d,statut:'facture',factureId:f.id};await safe(()=>put('docs',nd),'Facture créée en brouillon');openEditor(JSON.parse(JSON.stringify(f)));}
    if(a==='godevis'){const dv=S.docs.find(x=>x.id===(d.devisId||d.acompteDe));if(dv)openEditor(JSON.parse(JSON.stringify(dv)));else toast('Ce devis est introuvable');}
    if(a==='gofacture'){const f=S.docs.find(x=>x.id===d.factureId);if(f)openEditor(JSON.parse(JSON.stringify(f)));}
    if(a==='avoir')createAvoir(d);
    if(a==='dup'){const n=newDoc(d.type==='avoir'?'facture':d.type,{...evtOf(d),clientId:d.clientId,objet:d.objet,saisie:d.saisie||'ht',lignes:d.lignes.map(l=>({...l,id:uid()})),notes:d.notes,nature:d.nature});openEditor(n);}
    if(a==='paid')payForm(d);
    if(a==='acompte')acompteForm(d);
    if(a==='cancelq'){
      if(issuedFromQuote(d).length){toast("Une facture a déjà été émise depuis ce devis : annule-la avec un avoir.");return;}
      const dr=draftsFromQuote(d);
      if(!await confirmBox('Annuler ce devis ?',`Le devis ${esc(d.numero)} passera en « Annulé ». Il reste dans ton historique, mais sort des devis en cours, et son lien de signature en ligne ne fonctionnera plus.${dr.length?`<br><br>${dr.length} facture${dr.length>1?'s':''} en brouillon liée${dr.length>1?'s':''} à ce devis ser${dr.length>1?'ont':'a'} supprimée${dr.length>1?'s':''}.`:''}`,'Annuler le devis',true))return;
      try{for(const x of dr)await remove('docs',x.id);}catch(e){}
      const nd={...d,statut:'annule',annulation:{date:today()}};delete nd.factureId;
      await safe(()=>put('docs',nd),'Devis annulé');S.edit=nd;renderEditor();}
    if(a==='mksign'){const tk=payToken();const nd={...d,signToken:tk,lienDevis:window.GPF.quoteBase+tk+'/'};await safe(()=>put('docs',nd),'Lien de signature créé');S.edit=nd;renderEditor();}
    if(a==='copysign'){const v=$('#ro-signlink').value;try{await navigator.clipboard.writeText(v);toast('Lien copié');}catch(e){const i=$('#ro-signlink');i.focus();i.select();toast('Sélectionne le lien et copie-le');}}
    if(a==='mklink'){const tk=payToken();const nd={...d,payToken:tk,lienPaiement:window.GPF.payBase+tk+'/'};await safe(()=>put('docs',nd),'Lien de paiement créé');S.edit=nd;renderEditor();}
    if(a==='copylink'){const v=$('#ro-paylink').value;try{await navigator.clipboard.writeText(v);toast('Lien copié');}catch(e){const i=$('#ro-paylink');i.focus();i.select();toast('Sélectionne le lien et copie-le');}}
    if(a==='sent'){const nd={...d,statut:'envoye',envois:[...(d.envois||[]),{date:today(),kind:'manuel'}]};await safe(()=>put('docs',nd),'Devis marqué envoyé');S.edit=nd;renderEditor();}
    if(a==='mail'||a==='relance')emailForm(d,a==='relance'?'relance':'envoi');
    if(a==='lien'){const v=$('#ro-lien').value.trim();const nd={...d,lienPaiement:v};await safe(()=>put('docs',nd),'Lien enregistré');S.edit=nd;updatePreview();}
    if(a==='pdf')downloadPdf(d);
  });
}
async function deleteDraft(d){
  await remove('docs',d.id);
  if(d.devisId){const dv=S.docs.find(x=>x.id===d.devisId);if(dv&&dv.factureId===d.id){const nd={...dv,statut:'accepte'};delete nd.factureId;await put('docs',nd);}}
}
function acompteRecap(d,taux){
  const ls=(d.lignes||[]).filter(l=>l.designation&&!l.acompteRef&&(taux==null||rateOf(l,d)===taux));
  const out=[];if(taux!=null)out.push(`Part soumise à la TVA de ${fmtTaux(taux)}`);
  out.push(`Rappel du devis${d.objet?' « '+d.objet+' »':''} :`);
  ls.forEach(l=>{const q=fmtNum(+l.qte||0,(+l.qte%1)?2:0);out.push(`• ${l.remise?'':q+' × '}${l.designation.trim()} : ${eur(isTTC(d)?lineTTC(l,d):lineHT(l,d))}${isTTC(d)?' TTC':' HT'}`);});
  out.push(`Total du devis : ${eur(totals(d).ttc)} TTC`);
  return out.join('\n');
}
function signLabel(d){return d.acompteDemande&&HOSTED&&window.GPF.sumup?"Pour accepter le devis et régler l'acompte en ligne":'Pour accepter le devis en ligne';}
function issuedFromQuote(d){return (S.allDocs||S.docs).filter(x=>x.type==='facture'&&x.seq&&(x.acompteDe===d.id||x.devisId===d.id));}
function draftsFromQuote(d){return (S.allDocs||S.docs).filter(x=>x.type==='facture'&&!x.seq&&(x.acompteDe===d.id||x.devisId===d.id));}
function acomptesOf(d){return S.docs.filter(x=>x.type==='facture'&&x.acompteDe===d.id);}
function acompteForm(d){
  const t=totals(d);const deja=acomptesOf(d).reduce((x,a)=>x+totals(a).ttc,0);const reste=r2(t.ttc-deja);
  let mode='pct';
  openModal(`<div class="panel-h"><h2>Facture d'acompte</h2></div><div class="form">
    <div class="field full"><span class="hint">Devis ${esc(d.numero)} · total ${eur(t.ttc)} TTC${deja?` · déjà facturé en acompte : ${eur(deja)} · reste ${eur(reste)}`:''}</span></div>
    <div class="field full"><div class="seg" id="ac-mode"><button data-v="pct" class="on">En pourcentage</button><button data-v="eur">Montant TTC</button></div></div>
    <div class="field"><label for="ac-val" id="ac-lbl">Pourcentage du devis</label><input type="number" step="0.01" id="ac-val" value="${+d.acomptePct||30}"></div>
    <div class="field"><label>Montant de l'acompte</label><div class="num" id="ac-res" style="padding:8px 0;font-size:17px"></div></div>
    <div class="field full"><span class="hint">La facture d'acompte reprend la TVA du devis, au prorata. La facture de solde déduira cet acompte automatiquement.</span></div></div>
    <div class="foot"><button class="btn" data-a="no">Annuler</button><button class="btn primary" data-a="ok">Créer la facture d'acompte</button></div>`,dl=>{
    const amount=()=>{const v=+$('#ac-val',dl).value||0;return r2(mode==='pct'?t.ttc*v/100:v);};
    const upd=()=>{const m=amount();$('#ac-res',dl).textContent=eur(m)+' TTC';};upd();
    $('#ac-val',dl).addEventListener('input',upd);
    $$('#ac-mode button',dl).forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.v;$$('#ac-mode button',dl).forEach(x=>x.classList.toggle('on',x===b));$('#ac-lbl',dl).textContent=mode==='pct'?'Pourcentage du devis':'Montant TTC (€)';$('#ac-val',dl).value=mode==='pct'?30:r2(t.ttc*0.3);upd();}));
    dl.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='no'){closeModal();return;}
      const m=amount();if(m<=0){toast("Indique un montant d'acompte");return;}if(m>reste+0.005){toast(`L'acompte ne peut pas dépasser le reste à facturer (${eur(reste)})`);return;}
      const ratio=t.ttc?m/t.ttc:0;const pctTxt=fmtNum(ratio*100,(Math.abs(ratio*100-Math.round(ratio*100))<0.005)?0:2)+' %';
      let lignes=t.tvas.map(g=>({id:uid(),designation:`Acompte de ${pctTxt} sur le devis n° ${d.numero}`,details:acompteRecap(d,t.tvas.length>1?g.taux:null),qte:1,unite:'forfait',puTTC:r2((g.base+g.montant)*ratio),tva:g.taux}));
      const diff=r2(m-lignes.reduce((x,l)=>x+l.puTTC,0));if(lignes.length)lignes[0].puTTC=r2(lignes[0].puTTC+diff);
      lignes.forEach(l=>l.pu=r2(l.puTTC/(1+(isFranchise()?0:l.tva)/100)));
      const f=newDoc('facture',{...evtOf(d),clientId:d.clientId,objet:"Acompte – "+(d.objet||'devis '+d.numero),saisie:'ttc',lignes,acompteDe:d.id,acompteDevisNumero:d.numero,nature:'services'});
      closeModal();openEditor(f);toast("Facture d'acompte préparée. Vérifie-la puis émets-la.");});
  });
}
function payForm(d){
  openModal(`<div class="panel-h"><h2>Paiement de ${esc(d.numero)}</h2></div><div class="form">
    <div class="field"><label for="pay-date">Date du paiement</label><input type="date" id="pay-date" value="${today()}"></div>

/* ---------- paper (HTML preview) ---------- */
function legalLines(d){
  const s=d.entreprise||S.settings;const c=d.client||snapshotClient(clientById(d.clientId));const out=[];
  const il=idLine(s);if(il)out.push((s.nom?s.nom+' · ':'')+il);
  if(s.regimeTva==='franchise')out.push('TVA non applicable, art. 293 B du CGI.');
  if(d.type==='facture'){
    out.push(`Paiement ${(+s.delaiPaiement||0)===0?'à réception':'à '+(+s.delaiPaiement)+' jours'} (échéance le ${fmtDate(d.echeance)}). Pas d'escompte pour paiement anticipé.`);
    out.push(`En cas de retard de paiement : pénalités au ${s.penalites||"taux d'intérêt de la BCE majoré de 10 points"}.`);
    if(c&&c.type==='pro')out.push('Indemnité forfaitaire pour frais de recouvrement : 40 € (art. L441-10 du Code de commerce).');
    out.push(`Nature de l'opération : ${NATURES[d.nature]||NATURES.services}.`);
    if(s.tvaSurDebits&&s.regimeTva!=='franchise')out.push("Option pour le paiement de la taxe d'après les débits.");
    if(d.acompteDe)out.push(`Facture d'acompte sur le devis ${d.acompteDevisNumero||''}. Le solde fera l'objet d'une facture finale.`);
    else if(d.acompteLibre)out.push("Facture d'acompte. Le solde fera l'objet d'une facture finale, déduction faite de cet acompte.");
    else if(d.devisNumero)out.push(`Selon devis ${d.devisNumero}${(d.lignes||[]).some(l=>l.acompteRef)?', déduction faite des acomptes déjà facturés':''}.`);
  }
  if(d.type==='devis')out.push(`Devis valable jusqu'au ${fmtDate(d.validite)}.`);
  if(d.type==='avoir')out.push(`Avoir annulant ${d.avoirDe?'la facture '+d.avoirDe:'une facture'}.`);
  if(s.mentionsLibres)out.push(...s.mentionsLibres.split('\n').filter(Boolean));
  return out;
}
/* Header: just how to reach the company. Legal identifiers go in one compact line at the bottom of the document. */
function coLines(s){return [[String(s.adresse||'').replace(/\s*\n\s*/g,', '),[s.cp,s.ville].filter(Boolean).join(' ')].filter(Boolean).join(', '),[s.tel,s.email].filter(Boolean).join(' · ')].filter(Boolean);}
function idLine(s){const sir=String(s.siren||'').replace(/\D/g,'');const rcs=String(s.rcs||'').trim();const rcsHasSiren=sir&&rcs.replace(/\D/g,'').includes(sir);
  return [s.forme&&s.forme!=='Entreprise individuelle'?s.forme:'',rcs,sir&&!rcsHasSiren?'SIREN '+sir:'',s.tvaIntra&&s.regimeTva!=='franchise'?'TVA '+s.tvaIntra:''].filter(Boolean).join(' · ');}
function clLines(c){return c?[c.contact,c.adresse,[c.cp,c.ville].filter(Boolean).join(' '),c.siren?'SIREN '+c.siren:'',c.tvaIntra?'TVA '+c.tvaIntra:''].filter(Boolean):[];}

   ${lines.length?lines.map(l=>`<tr><td>${esc(l.designation)}${l.details?`<small>${esc(l.details).replace(/\n/g,'<br>')}</small>`:''}</td><td class="r">${fmtNum(+l.qte||0,(+l.qte%1)?2:0)} ${esc(l.unite)}</td><td class="r">${fmtNum(ttcCols(d)?+l.puTTC||0:puHT(l,d))}</td>${fr?'':`<td class="r">${fmtTaux(l.tva)}</td>`}<td class="r">${fmtNum(ttcCols(d)?lineTTC(l,d):lineHT(l,d))}</td>${extraTTC(d)?`<td class="r">${fmtNum(lineTTC(l,d))}</td>`:''}</tr>`).join(''):`<tr><td colspan="5" style="color:var(--paper-muted)">Ajoute des lignes…</td></tr>`}
   </tbody></table>
   <div class="pp-tot">${(si=>si?`<div style="font-weight:600"><span>${esc(si.label)}</span><span class="r">${eur(si.gross)}</span></div>${si.deps.map(x=>`<div><span>Acompte déjà facturé${x.numero?' (n° '+esc(x.numero)+')':''}</span><span class="r">−${eur(x.mt)}</span></div>`).join('')}<div style="border-bottom:1px solid var(--paper-line);margin-bottom:6px;padding-bottom:4px"></div>`:'')(soldeInfo(d))}<div><span>Total HT</span><span class="r">${eur(t.ht)}</span></div>${fr?'':t.tvas.map(x=>`<div><span>TVA ${fmtTaux(x.taux)} sur ${fmtNum(x.base)}</span><span class="r">${eur(x.montant)}</span></div>`).join('')}
   <div class="g"><span>${d.type==='avoir'?'Total avoir TTC':soldeInfo(d)?'Montant restant à payer TTC':'Total TTC'}</span><span class="r">${eur(d.type==='avoir'?-t.ttc:t.ttc)}</span></div>${acompteDemande(d)?`<div style="font-weight:600;color:var(--paper-accent)"><span>Acompte à verser (${fmtNum(acompteDemande(d).pct,0)} %)</span><span class="r">${eur(acompteDemande(d).mt)}</span></div>`:''}</div>
   ${d.type==='facture'&&d.lienPaiement?`<div class="pp-pay"><b>Payer par carte :</b> <a href="${esc(d.lienPaiement)}" target="_blank" rel="noopener" style="color:var(--paper-accent)">${esc(d.lienPaiement)}</a></div>`:''}

/* ---------- PDF ---------- */
function buildPdf(d,fx){
  const {jsPDF}=window.jspdf;const p=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  /* Factur-X: embedded fonts (PDF/A), and any character the font lacks is replaced so no blank glyph is drawn */
  const FF=fx?'LiberationSans':'helvetica';
  if(fx){p.addFileToVFS('LS-R.ttf',fx.r);p.addFont('LS-R.ttf',FF,'normal');p.addFileToVFS('LS-B.ttf',fx.b);p.addFont('LS-B.ttf',FF,'bold');
    const okc=new Set();['normal','bold'].forEach(st=>{const f=p.internal.getFont(FF,st);const m=f&&f.metadata&&f.metadata.cmap&&f.metadata.cmap.unicode&&f.metadata.cmap.unicode.codeMap;if(m)Object.keys(m).forEach(k=>{if(m[k])okc.add(+k);});});
    const clean=t=>{if(Array.isArray(t))return t.map(clean);let o='';for(const ch of String(t)){const c=ch.codePointAt(0);o+=(c===10||c===13||okc.has(c))?ch:/\s/.test(ch)?' ':(c===0xFE0F||c===0x200D)?'':'';}return o.replace(/ {2,}/g,' ').replace(/ +$/gm,'');};
    const oT=p.text.bind(p),oS=p.splitTextToSize.bind(p),oW=p.getTextWidth.bind(p);
    p.text=(t,...r)=>oT(clean(t),...r);p.splitTextToSize=(t,...r)=>oS(clean(t),...r);p.getTextWidth=t=>oW(clean(t));
    p.setFont(FF,'normal');}
  const s=d.entreprise||S.settings;const c=d.client||snapshotClient(clientById(d.clientId));const t=totals(d);const fr=s.regimeTva==='franchise';
  const ACC=[10,107,96],INK=[27,31,30],MUT=[107,116,113],LINE=[218,223,221];
  const W=210,M=16;let y=18;
  const txt=(str,x,yy,o={})=>{p.setFont(FF,o.b?'bold':'normal');p.setFontSize(o.s||9);p.setTextColor(...(o.c||INK));p.text(String(str),x,yy,o.a?{align:o.a}:undefined);};
  if(d.statut==='brouillon'||d.test){p.setFont(FF,'bold');p.setFontSize(70);p.setTextColor(235,238,237);p.text(d.statut==='brouillon'?'BROUILLON':'TEST',105,170,{align:'center',angle:25});}
  const L=S.settings;if(L.logo&&L.logoW&&L.logoH){try{const r=Math.min(45/L.logoW,18/L.logoH);const w=L.logoW*r,h=L.logoH*r;p.addImage(L.logo,L.logo.startsWith('data:image/png')?'PNG':'JPEG',M,y-6,w,h);y+=h-1;}catch(e){console.warn(e);}}
  txt(s.nom||'',M,y,{b:1,s:13});let yy=y+5;p.setFont(FF,'normal');p.setFontSize(8.5);coLines(s).forEach(l=>p.splitTextToSize(l,88).forEach(x=>{txt(x,M,yy,{c:MUT,s:8.5});yy+=4;}));
  const ttl=isAc(d)?"FACTURE D'ACOMPTE":{devis:'DEVIS',facture:'FACTURE',avoir:'AVOIR'}[d.type];
  txt(ttl,W-M,y+1,{b:1,s:ttl.length>10?15:20,c:ACC,a:'right'});txt(d.numero||'',W-M,y+8,{b:1,s:10,a:'right'});
  let ty=y+13;txt('Date : '+fmtDate(d.date),W-M,ty,{a:'right'});ty+=4.5;
  if(d.type==='facture'){txt('Échéance : '+fmtDate(d.echeance),W-M,ty,{a:'right'});ty+=4.5;}
  if(d.type==='devis'){txt('Validité : '+fmtDate(d.validite),W-M,ty,{a:'right'});ty+=4.5;}
  y=Math.max(yy,ty)+6;
  const cx=110,cl=clLines(c);const ch=8+5+cl.length*4.2;
  p.setDrawColor(...LINE);p.roundedRect(cx,y,W-M-cx,ch,1.5,1.5);
  txt(c?c.nom:'',cx+4,y+6,{b:1,s:10});cl.forEach((l,i)=>txt(l,cx+4,y+11+i*4.2,{c:MUT,s:8.5}));
  y+=ch+8;
  if(d.objet){p.setFont(FF,'bold');p.setFontSize(9.5);p.setTextColor(...INK);p.text('Objet : ',M,y);const w=p.getTextWidth('Objet : ');p.setFont(FF,'normal');p.text(p.splitTextToSize(d.objet,W-2*M-w),M+w,y);y+=7;}
  const ev=evtLines(d);if(ev.length){const lines=[];p.setFontSize(9);ev.forEach(x=>lines.push(...p.splitTextToSize(x,W-2*M-6)));p.setDrawColor(...ACC);p.setLineWidth(.8);p.line(M,y-3.5,M,y-3.5+lines.length*4.4);p.setLineWidth(.2);p.setFont(FF,'normal');p.setTextColor(...INK);p.text(lines,M+4,y);y+=lines.length*4.4+4;}
  const TC=ttcCols(d),PUL=TC?'PU TTC':'PU HT',TOL=TC?'Total TTC':'Total HT';
  const XT=extraTTC(d);
  const cols=XT?[{k:'Désignation',x:M},{k:'Qté',x:106,a:'right'},{k:'PU HT',x:128,a:'right'},{k:'TVA',x:144,a:'right'},{k:'Total HT',x:168,a:'right'},{k:'Total TTC',x:W-M,a:'right'}]
    :fr?[{k:'Désignation',x:M},{k:'Qté',x:128,a:'right'},{k:PUL,x:156,a:'right'},{k:TOL,x:W-M,a:'right'}]
    :[{k:'Désignation',x:M},{k:'Qté',x:118,a:'right'},{k:PUL,x:144,a:'right'},{k:'TVA',x:162,a:'right'},{k:TOL,x:W-M,a:'right'}];
  const header=()=>{cols.forEach(cc=>txt(cc.k.toUpperCase(),cc.x,y,{b:1,s:7.5,c:MUT,a:cc.a}));y+=2;p.setDrawColor(...INK);p.setLineWidth(.4);p.line(M,y,W-M,y);p.setLineWidth(.2);y+=5;};
  header();
  const descW=XT?78:(fr?104:92);
  for(const l of (d.lignes||[]).filter(l=>l.designation||hasPrice(l))){
    p.setFont(FF,'normal');p.setFontSize(9);const dl=p.splitTextToSize(l.designation||'',descW);p.setFontSize(8);const det=l.details?p.splitTextToSize(l.details,descW):[];
    const h=dl.length*4.2+det.length*3.6+3;
    if(y+h>270){p.addPage();y=20;header();}
    p.setFont(FF,'normal');p.setFontSize(9);p.setTextColor(...INK);p.text(dl,M,y);
    if(det.length){p.setFontSize(8);p.setTextColor(...MUT);p.text(det,M,y+dl.length*4.2-0.6);}
    const q=fmtNum(+l.qte||0,(+l.qte%1)?2:0)+' '+(l.unite||'');
    const pu=fmtNum(TC?+l.puTTC||0:puHT(l,d)),tot=fmtNum(TC?lineTTC(l,d):lineHT(l,d));const vals=XT?[q,pu,fmtTaux(l.tva),tot,fmtNum(lineTTC(l,d))]:fr?[q,pu,tot]:[q,pu,fmtTaux(l.tva),tot];
    vals.forEach((v,i)=>txt(v,cols[i+1].x,y,{a:'right'}));
    y+=h;p.setDrawColor(...LINE);p.line(M,y-2.2,W-M,y-2.2);y+=2;
  }
  const rows=[['Total HT',eur(t.ht)],...(fr?[]:t.tvas.map(x=>[`TVA ${fmtTaux(x.taux)} sur ${fmtNum(x.base)}`,eur(x.montant)]))];
  const si=soldeInfo(d);
  if(y+rows.length*5+30+(si?(si.deps.length+2)*5+6:0)>280){p.addPage();y=20;}
  y+=2;const tx=118;
  if(si){txt(si.label,tx,y,{b:1});txt(eur(si.gross),W-M,y,{b:1,a:'right'});y+=5;
    si.deps.forEach(x=>{txt('Acompte déjà facturé'+(x.numero?' (n° '+x.numero+')':''),tx,y,{c:MUT});txt('−'+eur(x.mt),W-M,y,{a:'right'});y+=5;});
    y-=2;p.setDrawColor(...LINE);p.line(tx,y,W-M,y);y+=5;}

  const ctx=doc.context;
  const meta=ctx.stream(new TextEncoder().encode(fxXmp(m)),{Type:'Metadata',Subtype:'XML'});
  doc.catalog.set(PDFName.of('Metadata'),ctx.register(meta));
  const icc=Uint8Array.from(atob(FX_ICC),ch=>ch.charCodeAt(0));
  const iccRef=ctx.register(ctx.flateStream(icc,{N:3}));
  const oi=ctx.obj({Type:'OutputIntent',S:'GTS_PDFA1',OutputConditionIdentifier:PDFHexString.fromText('sRGB IEC61966-2.1'),Info:PDFHexString.fromText('sRGB IEC61966-2.1'),DestOutputProfile:iccRef});
  doc.catalog.set(PDFName.of('OutputIntents'),ctx.obj([ctx.register(oi)]));
  /* jsPDF lists the 14 standard fonts on every page; none is used here (all text uses the embedded font) */
  for(const pg of doc.getPages()){const res=pg.node.Resources();const fd=res&&res.lookup(PDFName.of('Font'));if(fd&&fd.keys)for(const k of fd.keys()){const f=fd.lookup(k);if(f&&f.get&&String(f.get(PDFName.of('Subtype')))==='/Type1')fd.delete(k);}}
  for(const pg of doc.getPages()){const an=pg.node.Annots();if(!an)continue;for(let i=0;i<an.size();i++){const a=an.lookup(i);if(a&&a.set)a.set(PDFName.of('F'),PDFNumber.of(4));}}
  const rnd=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  ctx.trailerInfo.ID=ctx.obj([PDFHexString.of(rnd),PDFHexString.of(rnd)]);
  if(PDFHeader)ctx.header=PDFHeader.forVersion(1,7);
  const out=await doc.save({useObjectStreams:false,updateFieldAppearances:false});
  return new Blob([out],{type:'application/pdf'});
}
/* Every PDF goes through here: issued invoices and credit notes become Factur-X */
async function makePdf(d){

  return fxWrap(buildPdf(d,fonts),d);
}
function pdfName(d){

function csvFor(rows0){
  const rows=[...rows0].sort((a,b)=>(a.type+a.seq).localeCompare(b.type+b.seq)||a.seq-b.seq);
  const rates=[...new Set(rows.flatMap(d=>totals(d).tvas.map(x=>x.taux)))].sort((a,b)=>b-a);
  const q=v=>{v=String(v??'');return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const n=v=>fmtNum(v).replace(/ /g,'');
  const head=['Type','Numéro','Date','Échéance','Client','SIREN client','Objet','Total HT',...rates.map(r=>'TVA '+fmtTaux(r)),'Total TVA','Total TTC','Statut','Date paiement','Mode paiement','Facture liée'];
  const lines=rows.map(d=>{const t=totals(d);const sg=d.type==='avoir'?-1:1;const st=(STAT[d.type][statusOf(d)]||[''])[0];
    return [TYPE_LBL[d.type],d.numero,fmtDate(d.date),d.echeance?fmtDate(d.echeance):'',d.client&&d.client.nom,d.client&&d.client.siren,d.objet,n(sg*t.ht),...rates.map(r=>{const x=t.tvas.find(v=>v.taux===r);return x?n(sg*x.montant):'';}),n(sg*t.tva),n(sg*t.ttc),st,d.paiement?fmtDate(d.paiement.date):'',d.paiement?d.paiement.mode:'',d.avoirDe||d.devisNumero||''].map(q).join(';');});
  return '﻿'+[head.map(q).join(';'),...lines].join('\r\n');
}

/* ---------- charts ---------- */
function caSeries(){
  const now=new Date();const months=[];
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
  const v=Object.fromEntries(months.map(m=>[m,0]));
  S.docs.filter(d=>d.seq&&(d.type==='facture'||d.type==='avoir')).forEach(d=>{const m=(d.date||'').slice(0,7);if(m in v)v[m]+=(d.type==='avoir'?-1:1)*totals(d).ht;});
  return months.map(m=>({m,v:r2(v[m])}));
}
function caChart(){
  const data=caSeries();const max=Math.max(...data.map(x=>x.v),0);
  if(max<=0)return `<div class="empty" style="padding:24px 0">Le graphique se remplira avec tes factures émises.</div>`;
  const step=[50,100,200,250,500,1000,2000,2500,5000,10000,20000,25000,50000,100000].find(s=>max/s<=4)||Math.ceil(max/4);
  const top=Math.ceil(max/step)*step;const W=640,H=230,L=52,B=28,T=18,R=8;const bw=(W-L-R)/data.length;const y=v=>T+(H-T-B)*(1-v/top);
  let g='';for(let t=0;t<=top+0.001;t+=step){g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmtNum(t,0)}</text>`;}
  const mois=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  const bars=data.map((x,i)=>{const h=Math.max(0,y(0)-y(Math.max(0,x.v)));const cx=L+i*bw+bw/2;const cur=i===data.length-1;

function uploadLogo(file){

  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{

function parseCsv(text){
  text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const delim=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===delim){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else cur+=ch;}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;
}

      const iDate=find('date');const iAmt=find('montant total','total amount','montant','amount','total');const iSt=find('statut','status');const iRef=find('code de transaction','transaction code','id de transaction','transaction id','reference','description');
      const iType=find('type de transaction','transaction type','type');
      if(iDate<0||iAmt<0){res.innerHTML=`<div class="errs">Je n'ai pas trouvé les colonnes de date et de montant. Colonnes du fichier : ${esc(rows[0].join(', '))}</div>`;return;}
      const ok=v=>{const n=norm(v);if(!n)return true;if(/rembours|refund|echou|fail|annul|cancel|refus|declin|charge ?back/.test(n))return false;return /reuss|success|pay|paid|approv|accept|valid|effectu/.test(n);};
      const tx=rows.slice(1).map(r=>({date:parseDate(r[iDate]),amt:r2(parseAmount(r[iAmt])),st:iSt>=0?r[iSt]:'',ref:iRef>=0?r[iRef]:'',type:iType>=0?r[iType]:''}))
        .filter(t=>t.date&&t.amt>0&&ok(t.st)&&!/rembours|refund/.test(norm(t.type)));
      const openF=S.docs.filter(d=>d.type==='facture'&&['emise','retard'].includes(statusOf(d)));
      const used=new Set();proposals=[];
      tx.forEach((t,i)=>{const cands=openF.filter(f=>Math.abs(totals(f).ttc-t.amt)<0.01).sort((a,b)=>Math.abs(new Date(a.date)-new Date(t.date))-Math.abs(new Date(b.date)-new Date(t.date)));
        if(!cands.length)return;const pick=cands.find(c=>!used.has(c.id));if(pick)used.add(pick.id);proposals.push({i,t,cands,pick:pick?pick.id:''});});
      if(!proposals.length){res.innerHTML=`<div class="banner info"><span>${tx.length} paiement${tx.length>1?'s':''} réussi${tx.length>1?'s':''} lu${tx.length>1?'s':''}, mais aucun ne correspond au montant d'une facture à encaisser (${openF.length} en attente).</span></div>`;$('#imp-apply',dl).hidden=true;return;}
      res.innerHTML=`<p style="margin:4px 0 8px">${tx.length} paiement${tx.length>1?'s':''} réussi${tx.length>1?'s':''} lu${tx.length>1?'s':''}. <b>${proposals.length}</b> correspondance${proposals.length>1?'s':''} trouvée${proposals.length>1?'s':''} :</p>
        <div class="lines"><table class="imp-table"><thead><tr><th></th><th>Paiement SumUp</th><th class="r">Montant</th><th>Facture</th></tr></thead><tbody>
        ${proposals.map((p,k)=>`<tr><td><input type="checkbox" id="imp-ck-${k}" ${p.pick?'checked':''} aria-label="Valider"></td><td>${fmtDate(p.t.date)}<small class="muted" style="display:block">${esc(p.t.ref||'')}</small></td><td class="r num">${eur(p.t.amt)}</td>
        <td><select id="imp-sel-${k}"><option value="">Ne pas associer</option>${p.cands.map(c=>`<option value="${c.id}" ${c.id===p.pick?'selected':''}>${esc(c.numero)} · ${esc(clientLabel(c.client||clientById(c.clientId)))} · ${fmtDate(c.date)}</option>`).join('')}</select></td></tr>`).join('')}
        </tbody></table></div>`;
      $('#imp-apply',dl).hidden=false;};r.readAsText(f);});
    dl.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='close'){closeModal();return;}
      if(b.dataset.a==='apply'){const todo=[];const seen=new Set();
        proposals.forEach((p,k)=>{const ck=$('#imp-ck-'+k,dl),sel=$('#imp-sel-'+k,dl);if(ck&&ck.checked&&sel&&sel.value&&!seen.has(sel.value)){seen.add(sel.value);todo.push({id:sel.value,t:p.t});}});
        if(!todo.length){toast('Coche au moins une correspondance');return;}
        b.disabled=true;let n=0;
        try{for(const x of todo){const f=S.docs.find(d=>d.id===x.id);if(!f)continue;await put('docs',{...f,statut:'payee',paiement:{date:x.t.date,mode:'Carte (terminal SumUp)',ref:x.t.ref||''}});n++;}
          closeModal();toast(`${n} facture${n>1?'s':''} marquée${n>1?'s':''} payée${n>1?'s':''}`);}
        catch(err){console.error(err);b.disabled=false;toast(`${n} facture(s) mises à jour, puis une erreur. Réessaie pour le reste.`);}
      }
    });
  });
}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installPrompt=e;if(S.view==='parametres')render();});
window.addEventListener('appinstalled',()=>{S.installPrompt=null;toast('Appli installée sur ton appareil');});
/* ---------- boot ---------- */
route();
initData();
</script>
